<!Doctype html>
<html>
    <head>
        <title>HTML CSS: Assignment 1</title>
        <link rel="stylesheet" href="./assignment_1.css">
        <style>
            /*
                Internal CSS are written within the same html page inside the style tag. We write internal css inside the head tag.
            */
        </style>
    </head>
    <body>
        <h1 style="color: rgb(58, 13, 13);">Welcome to assignment 1</h1> <!-- This is inline css. it is written using style attribute of html tags. This css has highest priority-->
        <p>This is first assignment of HTML and CSS learning. It covers linking of external css file and also cover the concepts 
            of three ways of writing css. The three types are Inline CSS, Internal CSS and External CSS.
        </p>
    </body>
</html>
