            </ul>
        </nav>
    </header>
    <main>
        <div class="contactForm container">
            <form action="#">
                <div class="formInput">
                    <label for="name">Name:</label>
                    <input type="text" required id="name" name="name" placeholder="Rohit Kumar">
                </div>
                <div class="formInput">
                    <label for="email">Email:</label>
                    <input type="email" required id="email" name="email" placeholder="yourexample@gmail.com">
                </div>
                <div class="formInput">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message"></textarea>
                </div>
                <div class="formInput">
                    <button type="submit">Submit</botton>
                </div>
            </form>
        </div>
    </main>
