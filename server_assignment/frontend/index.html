<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body class="bg-light">

<div class="container my-4">

    <!-- Server Time -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="bi bi-clock"></i> Server Time
            </h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-5 mb-2">
                    <p class="mb-1"><strong>Status:</strong> 
                        <span id="status" class="badge bg-secondary">Disconnected</span>
                    </p>
                </div>
                <div class="col-md-7 mb-2">
                    <p class="mb-1"><strong>Current Time:</strong> 
                        <span id="time" class="fs-4 text-primary fw-bold">--:--:--</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="mb-3 d-flex gap-2">
        <button id="addTeacher" class="btn btn-success">Add Teacher</button>
        <button id="editTeacher" class="btn btn-warning">Edit Teacher</button>
        <button id="deleteTeacher" class="btn btn-danger">Delete Selected</button>
    </div>

    <p id="message" class="fw-bold text-danger"></p>
    <!-- Teacher Table -->
    <div class="table-responsive">
        <table id="teacherTable" class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th><input type="checkbox" id="selectAll"></th>
                    <th>Teacher ID</th>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- rows will be added via javascript -->
            </tbody>
        </table>
    </div>

    <!-- File Upload Section -->
    <div class="fileUpload card p-3 my-4">
        <h5 class="mb-3">Upload File</h5>

        <div class="mb-2">
            <input type="file" id="fileInput" class="form-control">
        </div>

        <button id="uploadBtn" class="btn btn-primary mb-2">Upload</button>

        <progress id="uploadProgress" value="0" max="100" class="w-100"></progress>

        <p id="uploadStatus" class="mt-2">Upload status:</p>
    </div>

    <!-- File Download Section -->
    <div class="fileDownload card p-3 my-4">
        <h5 class="mb-3">Download File</h5>

        <div class="d-flex gap-2 mb-2">
            <button id="downloadBtn" class="btn btn-primary">Download</button>
            <button id="pauseBtn" class="btn btn-warning">Pause</button>
            <button id="resumeBtn" class="btn btn-success">Resume</button>
        </div>

        <progress id="downloadProgress" value="0" max="100" class="w-100"></progress>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="./app.js"></script>

</body>
</html>
